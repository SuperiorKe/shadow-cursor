<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shadow Cursor settings</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 14px/1.5 system-ui, sans-serif;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p.sub { margin: 0 0 24px; opacity: 0.7; }
      label { display: block; font-weight: 600; margin: 18px 0 6px; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 8px 10px;
        border: 1px solid #8884;
        border-radius: 6px;
        background: transparent;
        color: inherit;
      }
      .hint { font-size: 12px; opacity: 0.7; margin-top: 4px; }
      button {
        margin-top: 24px;
        font: inherit;
        padding: 8px 16px;
        border-radius: 6px;
        border: 1px solid #8886;
        background: #4f46e5;
        color: white;
        cursor: pointer;
      }
      #status { margin-left: 12px; opacity: 0.8; }
      code { font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Shadow Cursor</h1>
    <p class="sub">Point at anything, press <code>Alt+Shift+S</code>, ask.</p>

    <label for="apiKey">Anthropic API key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" />
    <div class="hint">Stored locally in this browser only. Never synced.</div>

    <label for="model">Model</label>
    <select id="model">
      <option value="claude-opus-5">Claude Opus 5 (default)</option>
      <option value="claude-sonnet-5">Claude Sonnet 5</option>
      <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
    </select>

    <label for="effort">Effort</label>
    <select id="effort">
      <option value="low">Low (fastest)</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <div class="hint">Controls thinking depth. Low keeps hover answers snappy.</div>

    <label for="persona">Default persona</label>
    <select id="persona">
      <option value="critic">Critic</option>
      <option value="tutor">Tutor</option>
    </select>

    <label for="baseUrl">API base URL <span style="font-weight:400;opacity:.7">(advanced, optional)</span></label>
    <input id="baseUrl" type="url" placeholder="https://api.anthropic.com" autocomplete="off" />
    <div class="hint">Leave empty unless you route through a proxy.</div>

    <button id="save">Save</button><span id="status"></span>

    <p class="hint" style="margin-top: 32px">
      Change the hotkey at <code>chrome://extensions/shortcuts</code>.
    </p>
    <script src="options.js"></script>
  </body>
</html>
