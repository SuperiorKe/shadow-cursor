<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shadow Cursor fixture</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 40px; color: #222; background: #fafafa; }
      .card { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 24px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 16px; color: #555; }
      label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
      .actions { display: flex; gap: 10px; margin-top: 20px; }
      button { font: inherit; padding: 9px 16px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
      button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; padding: 9px 14px; }
      button.danger { color: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Project settings</h1>
      <p>Update the name and visibility of your project.</p>
      <form>
        <label for="name">Project name</label>
        <input id="name" value="Shadow Cursor" />
        <label for="slug">URL slug</label>
        <input id="slug" placeholder="shadow-cursor" />
        <div class="actions">
          <button type="button" class="primary" id="save">Save changes</button>
          <button type="button" id="cancel">Cancel</button>
          <button type="button" class="danger" id="delete">Delete project</button>
        </div>
      </form>
    </div>
  </body>
</html>
